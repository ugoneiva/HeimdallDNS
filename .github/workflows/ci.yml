name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: Emissão de certificado num servidor ACME de teste (Pebble)
        run: |
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1
          HEIMDALL_PEBBLE_BIN=$(go env GOPATH)/bin/pebble \
          HEIMDALL_PEBBLE_ROOT=$(go env GOMODCACHE)/github.com/letsencrypt/pebble/v2@v2.10.1 \
          go test -race -count=1 -run TestPebble -v ./internal/certs
      - name: Vulnerabilidades conhecidas
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  painel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Todos os textos do painel têm tradução
        run: npm run i18n
        working-directory: web
      - name: Painel compilado está em dia no repositório
        run: git diff --exit-code --stat -- internal/webui/dist || (echo "rode 'make web' e commite internal/webui/dist" && exit 1)
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web

  pacotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=docker,sign,sbom
