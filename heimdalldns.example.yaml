# HeimdallDNS — configuração de exemplo.
# Copie para /etc/heimdalldns/heimdalldns.yaml. Tudo que for omitido usa o padrão.

dns:
  # Endereços onde o DNS escuta (UDP e TCP).
  listen: ["0.0.0.0:53", "[::]:53"]
  # Quem pode consultar. Vazio = redes privadas (10/8, 172.16/12, 192.168/16,
  # 100.64/10, loopback, fc00::/7, link-local). Nunca exponha para a internet.
  allowed_networks: []
  # Resposta para domínio bloqueado: null (0.0.0.0 / ::), nxdomain, refused ou drop.
  block_mode: "null"
  block_ttl: 10
  # DNS criptografado (DoT/DoH), também para aparelhos fora da rede. Cada
  # aparelho pode ganhar um endereço próprio no painel (Dispositivos → Fora da rede).
  public_host: ""           # ex.: dns.suaempresa.com.br (aponte para este servidor)
  dot_listen: []            # ex.: [":853"]  (DoT por aparelho: registro curinga *.public_host)
  doh_listen: ""            # ex.: ":443"
  doh_plain_http: false     # DoH em HTTP puro, atrás de um proxy reverso que termina o TLS
  tls_cert: ""              # certificado em arquivo (recarregado quando o certbot renova)
  tls_key: ""
  acme: false               # ou certificado automático do Let's Encrypt (precisa da 443 aberta)
  acme_email: ""
  # Limite de consultas por cliente (IP); acima dele, REFUSED e um alerta por
  # minuto. Protege contra aparelho infectado ou em loop. O loopback nunca é
  # limitado. Se o roteador repassa a rede inteira por um IP só, libere-o.
  rate_limit:
    qps: 100                # 0 desliga
    burst: 1000             # rajada aceita (ex.: aparelho ligando)
    exempt: []              # ex.: ["192.168.0.1/32"]

upstream:
  # DNS comum (1.1.1.1:53), DoH (https://), DoT (tls://), DoQ (quic://) ou DNSCrypt (sdns://).
  servers:
    - https://cloudflare-dns.com/dns-query
    - tls://dns.quad9.net
  # Resolvem os nomes dos upstreams acima. Precisam ser IPs.
  bootstrap: ["1.1.1.1:53", "9.9.9.9:53"]
  # fastest (menor latência medida, com failover), parallel ou failover.
  mode: fastest
  timeout: 3s
  health_interval: 30s
  # Usar só upstreams que validam DNSSEC. Cada um é testado na partida e a cada
  # 6 h (domínio com assinatura quebrada tem que falhar; assinado tem que vir
  # validado); o resultado aparece na tela DNS. Se nenhum validar, usa todos.
  require_dnssec: false

cache:
  size: 20000       # número de respostas
  min_ttl: 0        # segundos
  max_ttl: 86400
  serve_stale: 1h   # serve a resposta vencida enquanto renova; 0 desliga

filter:
  update_interval: 24h
  # Formatos aceitos: hosts, domínios (um por linha) e Adblock (||dominio^, @@exceção, /regex/).
  # Em hosts e listas de domínios, a regra vale só para o nome exato.
  lists:
    - name: StevenBlack Unified
      url: https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
    - name: HaGeZi Pro
      url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/pro.txt
      enabled: false
    # category: threat = lista de ameaças; um bloqueio por ela vira alerta de segurança.
    - name: HaGeZi Threat Intelligence
      url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/tif.txt
      category: threat
      enabled: false
  # Regras próprias: um domínio simples vale para ele e todos os subdomínios.
  deny: []
  allow: []

# Radar de dispositivos.
clients:
  # Onde perguntar o nome dos dispositivos (PTR): "auto" usa o gateway padrão,
  # que normalmente conhece os nomes do DHCP; "" desliga; ou "192.168.0.1:53".
  ptr_server: auto
  # Resposta padrão para um dispositivo isolado: null, nxdomain, refused ou drop.
  isolate_mode: refused
  neighbor_interval: 1m     # leitura da tabela ARP/NDP (MAC dos dispositivos)
  vendor_db_max_age: 720h   # base de fabricantes (OUI), baixada do Wireshark

# Painel web e API de controle (a API também é usada pelos comandos
# "heimdalldns clients", "isolate" etc.).
api:
  # Só nesta máquina por padrão. Para abrir o painel de outros computadores,
  # use 0.0.0.0:8053 e, de preferência, HTTPS (tls_cert/tls_key).
  listen: 127.0.0.1:8053    # "" desliga
  token: ""                 # vazio = gerado em <data_dir>/api.token
  tls_cert: ""              # ex.: /etc/heimdalldns/cert.pem, ou "auto" (autoassinado gerado no data_dir)
  tls_key: ""

# Detecções de segurança. Estes são os valores iniciais: depois que o painel
# salvar (Segurança → Detecções), valem os do painel.
security:
  dga: true                 # vários nomes aleatórios inexistentes: malware procurando o C2
  tunnel: true              # muitos subdomínios longos e únicos: túnel/exfiltração por DNS
  nrd: true                 # idade do domínio via RDAP (o nome do domínio vai ao registro dele)
  nrd_action: alert         # alert ou block
  nrd_max_age: 720h         # "recém-registrado" = até 30 dias
  new_device_alerts: true
  auto_isolate: []          # threat_blocked, dga, dns_tunnel, nrd: isola o dispositivo na hora
  ignore_domains: []

# Exportação para SIEM (Wazuh etc.). Regras prontas em deploy/wazuh/.
export:
  file: ""                  # ex.: /var/log/heimdalldns/events.json (JSON por linha)
  syslog: ""                # ex.: udp://10.0.0.5:514
  queries: none             # além dos alertas: none, blocked ou all

# Servidor DHCPv4 opcional. DESLIGUE O DHCP DO ROTEADOR ANTES: dois servidores
# DHCP na mesma rede brigam. Com ele, os aparelhos recebem este servidor como
# DNS, o radar aprende MAC e nome direto da concessão e os nomes resolvem como
# <nome>.<domínio> (com reverso). Reservas (IP fixo por MAC) pelo painel.
dhcp:
  enabled: false
  interface: ""             # ex.: eth0
  range_start: ""           # ex.: 192.168.1.100
  range_end: ""             # ex.: 192.168.1.200
  subnet: ""                # vazio = a da interface
  router: []                # vazio = o gateway padrão desta máquina
  dns: []                   # vazio = esta máquina
  domain: lan
  lease_time: 24h

# Alta disponibilidade: um principal e uma ou mais réplicas. Entregue os dois
# como servidores DNS (no DHCP ou no roteador). Listas, regras, segurança,
# dispositivos e a senha do painel vão do principal para as réplicas em ~1 s;
# histórico e alertas ficam em cada nó; o DHCP fica num nó só. A réplica é só
# leitura (altere no principal).
ha:
  role: ""                  # "" (nó único), primary ou replica
  sync_token: ""            # segredo de 16+ caracteres, o mesmo em todos os nós
  primary_url: ""           # réplica: URL da API do principal, ex.: https://10.0.0.2:8053
  insecure_tls: false       # réplica: aceita certificado autoassinado do principal

# Active Directory (opcional): usuários, grupos e DNS do AD pelo painel.
# Funciona com AD do Windows e Samba AD. Começa só leitura; alterações exigem
# write: true E a verificação em duas etapas ligada no painel. Contas e grupos
# privilegiados nunca são alterados.
ad:
  enabled: false
  url: ""                   # ldaps://dc01.empresa.local (ou ldap:// com StartTLS)
  base_dn: ""               # vazio = descoberto no controlador
  bind_user: ""             # svc-heimdall@empresa.local (conta delegada, não Domain Admin)
  bind_password_file: ""    # arquivo com a senha (chmod 600); a senha nunca vai aqui
  ca_file: ""               # CA que emitiu o certificado LDAPS do controlador
  insecure_tls: false       # só para laboratório
  write: false              # libera criar/alterar/excluir
  user_ous: []              # ex.: ["OU=Colaboradores,DC=empresa,DC=local"]
  managed_groups: []        # ex.: ["VPN-Usuarios", "Wi-Fi-Corporativo"]
  dns_zones: []             # ex.: ["empresa.local"]
  # Entrar no painel com as contas do AD. O papel vem do primeiro grupo que
  # casar (admin, depois operator, depois viewer); quem não está em nenhum,
  # não entra. Grupos aninhados contam.
  login:
    enabled: false
    admin_groups: []        # ex.: ["TI-Infra"]
    operator_groups: []     # ex.: ["Service-Desk"]
    viewer_groups: []       # ex.: ["Auditoria"]
    require_mfa: true       # cadastra o MFA no primeiro acesso

# Cópias automáticas (o painel e "heimdalldns backup" geram cópias na hora).
backup:
  interval: 24h             # 0 desliga
  keep: 7                   # quantas guardar
  dir: ""                   # "" = <data_dir>/backups
  full: false               # true inclui o histórico de consultas

# Histórico de consultas.
history:
  store_queries: true      # grava cada consulta (os resumos por minuto/hora são sempre gravados)
  retention: 168h          # consultas detalhadas: 7 dias (~120 bytes por consulta)
  stats_retention: 2160h   # resumos para os gráficos: 90 dias

# Respostas locais (A/AAAA), por exemplo para equipamentos da rede.
local_records:
  # nas.casa: ["192.168.0.10"]

data_dir: /var/lib/heimdalldns

log:
  level: info      # debug, info, warn, error
  queries: false   # registra cada consulta no log
